name: Content migration quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit and contract tests
        run: pytest -q --cov=content_migration_gate --cov-branch --cov-report=term-missing --cov-fail-under=85 tests/unit

  service-integration-tests:
    runs-on: ubuntu-latest
    needs: unit-and-contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install -e '.[dev]'
      - name: Build and start the three-service stack
        run: docker compose up --build --detach
      - name: Wait for health checks and run black-box tests
        env:
          CONTENT_GATE_E2E: "1"
          CMS_BASE_URL: http://127.0.0.1:8101
          ADMIN_BASE_URL: http://127.0.0.1:8102
          SITE_BASE_URL: http://127.0.0.1:8103
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          endpoints = [
              "http://127.0.0.1:8101/health",
              "http://127.0.0.1:8102/health",
              "http://127.0.0.1:8103/health",
          ]
          deadline = time.monotonic() + 90
          pending = set(endpoints)
          while pending and time.monotonic() < deadline:
              for endpoint in tuple(pending):
                  try:
                      with urllib.request.urlopen(endpoint, timeout=2) as response:
                          if response.status == 200:
                              pending.remove(endpoint)
                  except (OSError, urllib.error.URLError):
                      pass
              if pending:
                  time.sleep(2)
          if pending:
              raise SystemExit(f"Services failed to become healthy: {sorted(pending)}")
          PY
          pytest -q tests/e2e
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
