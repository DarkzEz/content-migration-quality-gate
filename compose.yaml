name: content-migration-quality-gate

services:
  cms:
    build: .
    command: ["uvicorn", "content_migration_gate.cms:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8101:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  site:
    build: .
    command: ["uvicorn", "content_migration_gate.site:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8103:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  admin:
    build: .
    command: ["uvicorn", "content_migration_gate.admin:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CMS_BASE_URL: http://cms:8000
      SITE_BASE_URL: http://site:8000
      UPSTREAM_TIMEOUT_SECONDS: "${UPSTREAM_TIMEOUT_SECONDS:-2.0}"
      BLOCKED_TERMS: "${BLOCKED_TERMS:-do-not-publish,internal-only}"
    ports:
      - "127.0.0.1:8102:8000"
    depends_on:
      cms:
        condition: service_healthy
      site:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
